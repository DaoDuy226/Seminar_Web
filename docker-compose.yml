services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: library-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Library@2026"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - library_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  library_sqlserver_data:
